name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          [
            user-service,
            user-product-service,
            notifaction-service,
            food-service,
            auth-service,
            analytics-service,
            mail-service,
            api-geteway,
            ai-service
          ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          cd ${{ matrix.service }}
          docker build -t gopherkhb/what-food-${{ matrix.service }}:latest .
          docker push gopherkhb/what-food-${{ matrix.service }}:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/what-food-ai/what-food-ai-compose
            docker compose pull
            docker compose up -d
            docker exec what-food-postgres psql -U postgres -c "ALTER USER postgres WITH PASSWORD 'secret';"